---
swh::deploy::environment: staging
dns::search_domains:
  - internal.staging.swh.network

swh::postgres::service::dbs:
  - alias: admin-swh
    name: "%{lookup('swh::deploy::storage::db::dbname')}"
    host: "%{lookup('swh::deploy::storage::db::host')}"
    port: "%{lookup('swh::deploy::db::pgbouncer::port')}"
    user: "%{lookup('swh::deploy::storage::db::user')}"
    password: "%{lookup('swh::deploy::storage::db::password')}"
  - alias: swh
    name: "%{lookup('swh::deploy::storage::db::dbname')}"
    host: "%{lookup('swh::deploy::storage::db::host')}"
    port: "%{lookup('swh::deploy::db::pgbouncer::port')}"
    user: guest
  - alias: swh-deposit
    name: "%{lookup('swh::deploy::deposit::db::dbname')}"
    host: "%{lookup('swh::deploy::deposit::db::host')}"
    port: "%{lookup('swh::deploy::db::pgbouncer::port')}"
    user: guest
  - alias: swh-indexer
    name: "%{lookup('swh::deploy::indexer::storage::db::dbname')}"
    host: "%{lookup('swh::deploy::indexer::storage::db::host')}"
    port: "%{lookup('swh::deploy::db::pgbouncer::port')}"
    user: guest
  - alias: swh-scheduler
    name: "%{lookup('swh::deploy::scheduler::db::dbname')}"
    host: "%{lookup('swh::deploy::scheduler::db::host')}"
    port: "%{lookup('swh::deploy::db::pgbouncer::port')}"
    user: guest
  - alias: swh-scrubber
    name: "%{lookup('swh::deploy::scrubber::db::dbname')}"
    host: "%{lookup('swh::deploy::scrubber::db::host')}"
    port: "%{lookup('swh::deploy::db::pgbouncer::port')}"
    user: guest
  - alias: swh-web
    name: "%{lookup('swh::deploy::webapp::db::name')}"
    host: "%{lookup('swh::deploy::webapp::db::host')}"
    port: "%{lookup('swh::deploy::db::pgbouncer::port')}"
    user: guest

swh::deploy::storage::db::host: db.internal.staging.swh.network
swh::deploy::storage::db::user: swh
swh::deploy::storage::db::dbname: swh

swh::deploy::deposit::db::host: db.internal.staging.swh.network
swh::deploy::deposit::db::dbname: swh-deposit

swh::deploy::indexer::storage::db::host: db.internal.staging.swh.network
swh::deploy::indexer::storage::db::dbname: swh-indexer

swh::deploy::scheduler::db::host: db.internal.staging.swh.network
swh::deploy::scheduler::db::dbname: swh-scheduler

swh::deploy::scrubber::db::host: db.internal.staging.swh.network
swh::deploy::scrubber::db::dbname: swh-scrubber

swh::deploy::webapp::inbound_email::domain: "%{lookup('swh::deploy::webapp::inbound_email::staging::domain')}"

#### Rabbitmq instance to use
# swh::deploy::worker::task_broker::password in private data
swh::deploy::worker::task_broker: "amqp://swhconsumer:%{lookup('swh::deploy::worker::task_broker::password')}@scheduler0.internal.staging.swh.network:5672/%2f"

#### Storage/Indexer/Vault/Scheduler services to use in staging area

swh::remote_service::storage0::url: "http://storage1.internal.staging.swh.network:%{lookup('swh::remote_service::storage::port')}/"

swh::remote_service::storage::config::storage0:
  cls: remote
  url: "%{alias('swh::remote_service::storage0::url')}"
swh::remote_service::storage::config: "%{alias('swh::remote_service::storage::config::storage0')}"
swh::remote_service::storage::config::writable: &swh_remote_service_storage_config_writable
  "%{alias('swh::remote_service::storage::config::storage0')}"

swh::deploy::deposit::url: https://deposit.staging.swh.network
swh::deploy::deposit::internal_url: "https://deposit-rp.internal.staging.swh.network"

kafka::broker::heap_opts: "-Xmx3G -Xms3G -XX:MaxDirectMemorySize=6G"
kafka::version: "3.6.1"
kafka::inter_broker_protocol_version: "3.6"
kafka::log_message_format_version: "3.6"

swh::kafkabackup::ssh_pubkeys:
  kafkabackup@swh-k8s-staging:
    type: ssh-ed25519
    key: 'AAAAC3NzaC1lZDI1NTE5AAAAIKPOR9xqQkrLkv87VxTDurD0TvFWOcXPg5Z71wcLKVAF'
swh::kafkabackup::enable: true

swh::deploy::journal::brokers:
  - journal2.internal.staging.swh.network

swh::deploy::deposit::vhost::letsencrypt_cert: deposit_staging
swh::deploy::deposit::reverse_proxy::backend_http_host: deposit-dynamic.internal.staging.swh.network
swh::deploy::deposit::reverse_proxy::backend_http_port: "80"

swh::deploy::webapp::vhost::letsencrypt_cert: archive_staging
swh::deploy::webapp::reverse_proxy::backend_http_host: webapp-cassandra.internal.staging.swh.network
swh::deploy::webapp::reverse_proxy::backend_http_port: "80"

swh::deploy::datasets::vhost::letsencrypt_cert: datasets_staging
swh::deploy::datasets::reverse_proxy::backend_http_host: datasets.internal.staging.swh.network
swh::deploy::datasets::reverse_proxy::backend_http_port: "80"

swh::deploy::objstorage::vhost::letsencrypt_cert: objstorage_staging
swh::deploy::objstorage::reverse_proxy::backend_http_host: objstorage-ro.internal.staging.swh.network
swh::deploy::objstorage::reverse_proxy::basic_auth::users:
  - swh-stg

swh::deploy::docs::vhost::letsencrypt_cert: docs_staging
swh::deploy::docs::reverse_proxy::backend_http_host: docs.internal.staging.swh.network
swh::deploy::docs::reverse_proxy::backend_http_port: "80"

swh::deploy::objstorage::backend::public_server_name:
  objstorage.staging.swh.network
  objstorage.internal.staging.swh.network

swh::deploy::objstorage::backend::server_names:
  - "%{alias('swh::deploy::objstorage::backend::public_server_name')}"
  - "%{::swh_hostname.internal_fqdn}"
  - "%{::hostname}"
  - 127.0.0.1
  - localhost
  - "::1"

swh::deploy::reverse_proxy::services:
  - deposit
  - webapp
  - objstorage
  - software-stories
  - coarnotify
  - datasets
  - docs
  - osporadar

swh::postgresql::version: '13'
swh::postgresql::port: 5433
swh::postgresql::cluster_name: "%{lookup('swh::postgresql::version')}/main"
swh::postgresql::datadir_base: "%{lookup('swh::base_directory')}/postgres"
swh::postgresql::datadir: "%{lookup('swh::postgresql::datadir_base')}/%{lookup('swh::postgresql::cluster_name')}"
swh::postgresql::listen_addresses:
  - "0.0.0.0"
  - "::"
swh::postgresql::network_accesses:
  - 192.168.100.0/24 # Monitoring
  - 192.168.130.0/24 # Staging services

swh::postgresql::shared_buffers: 32GB

postgresql::server::config_entries:
  shared_buffers: "%{alias('swh::postgresql::shared_buffers')}"
  cluster_name: "%{alias('swh::postgresql::cluster_name')}"

swh::dbs:
  storage:
    name: swh
    user: swh

pgbouncer::auth_hba_file: "/etc/postgresql/%{lookup('swh::postgresql::cluster_name')}/pg_hba.conf"
pgbouncer::common::listen_addresses:
  - "0.0.0.0"
  - "::"
pgbouncer::databases:
  - source_db: swh
    host: localhost
    auth_user: postgres
    port: 5433
    alias: staging-swh

# open objstorage api
swh::deploy::objstorage::backend::listen::host: 0.0.0.0
swh::deploy::objstorage::backend::workers: 16
swh::deploy::objstorage::directory: "%{lookup('swh::deploy::storage::directory')}"
swh::deploy::objstorage::slicing: 0:1/1:5

nginx::worker_processes: 4

## Reverse-proxy and frontend

hitch::frontend: "[*]:443"
hitch::proxy_support: true

varnish::http_port: 80

apache::http_port: 9080
# Disable default vhost on port 80
apache::default_vhost: false

# Elasticsearch
elasticsearch::config::cluster::name: swh-search

elasticsearch::config::discovery::seed_hosts:
  - search-esnode0.internal.staging.swh.network
elasticsearch::config::cluster::initial_master_nodes:
  - search-esnode0

elasticsearch::jvm_options::heap_size: 16g
elasticsearch::config::prometheus::indices: true

swh::elasticsearch::search_nodes:
  - host: search-esnode0.internal.staging.swh.network
    port: 9200

swh::deploy::webapp::url: "https://webapp.staging.swh.network"

swh::config::keycloak::realm_name: SoftwareHeritageStaging

syncoid::public_keys::storage1:
  type: ssh-ed25519
  key: "AAAAC3NzaC1lZDI1NTE5AAAAIB0y7dvB0cBluC+Dy+w51P6JCbB18whd/IekP5148XsS"
syncoid::public_keys::db1:
  type: ssh-ed25519
  key: "AAAAC3NzaC1lZDI1NTE5AAAAILRVodfvLudSiOdWOPDSoN5MIwZPbyZAyClfr/SQUK4w"

swh::deploy::maven_index_exporter::url: maven-exporter.internal.staging.swh.network

cassandra::default_cluster_name: archive_staging

cassandra::nodes:
  cassandra1.internal.staging.swh.network:
    instances:
      instance1:
        cluster_name: archive_staging
  cassandra2.internal.staging.swh.network:
    instances:
      instance1:
        cluster_name: archive_staging
  cassandra3.internal.staging.swh.network:
    instances:
      instance1:
        cluster_name: archive_staging

cassandra::clusters:
  archive_staging:
    seed_provider:
      - class_name: org.apache.cassandra.locator.SimpleSeedProvider
        parameters:
          - seeds: "cassandra1.internal.staging.swh.network:7000"

cassandra::disable_stcs_in_l0: true
cassandra::paxos::repair::enable: true

# Software-stories
swh::deploy::software-stories::reverse_proxy::backend_http_host: software-stories.internal.staging.swh.network
swh::deploy::software-stories::base_url: software-stories.staging.swh.network
swh::deploy::software-stories::vhost::letsencrypt_cert: software-stories_staging

# coarnotify
swh::deploy::coarnotify::reverse_proxy::backend_http_host: inbox.internal.staging.swh.network
swh::deploy::coarnotify::reverse_proxy::backend_http_port: "80"
swh::deploy::coarnotify::base_url: inbox.staging.swh.network
swh::deploy::coarnotify::vhost::letsencrypt_cert: coarnotify_staging
swh::deploy::coarnotify::icinga_check_string: 'COAR Notify Inbox'

# osporadar
swh::deploy::osporadar::reverse_proxy::backend_http_host: k8s-archive-staging-rke2.internal.staging.swh.network
swh::deploy::osporadar::reverse_proxy::backend_http_port: "80"
swh::deploy::osporadar::vhost::letsencrypt_cert: osporadar_staging
swh::deploy::osporadar::icinga_check_string: 'OSPO-RADAR'


varnish::enable_anubis: true
