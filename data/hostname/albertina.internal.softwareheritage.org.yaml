---

swh::apt_config::enable_non_free: true
packages:
  - amd64-microcode

icinga2::host::vars:
  load: high


mountpoints:
  /tmp:
    ensure: absent
  /srv/storage/space:
    ensure: absent
  swap:
    ensure: absent

prometheus::sql::config_snippets:
  - swh-scheduler
  - swh-storage
  - swh-scrubber

pgbouncer::auth_hba_file: /etc/pgbouncer/pg_hba.conf
pgbouncer::listen_addr: 192.168.100.212
pgbouncer::config_params:
  max_client_conn: 4000
  default_pool_size: 4000
  max_db_connections: 4000
  max_user_connections: 4000

pgbouncer::databases:
  # swh
  - source_db: softwareheritage
    host: albertina.internal.softwareheritage.org
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::db::main::port')}"
  # catch-all
  - source_db: "*"
    host: 127.0.0.1
    auth_user: postgres
    port: "%{lookup('swh::deploy::db::secondary::port')}"
