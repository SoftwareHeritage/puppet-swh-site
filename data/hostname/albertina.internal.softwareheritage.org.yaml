---

swh::apt_config::enable_non_free: true
packages:
  - amd64-microcode

icinga2::host::vars:
  load: high


mountpoints:
  /tmp:
    ensure: absent
  /srv/storage/space:
    ensure: absent
  swap:
    ensure: absent

prometheus::sql::config_snippets:
  - swh-scheduler
  - swh-storage
  - swh-scrubber

pgbouncer::auth_hba_file: /etc/pgbouncer/pg_hba.conf
pgbouncer::listen_addr: 192.168.100.212
pgbouncer::databases:
  # swh
  - source_db: "%{hiera('swh::deploy::storage::db::dbname')}"
    host: "%{hiera('swh::deploy::storage::db::backend::host')}"
    auth_user: "%{hiera('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{hiera('swh::deploy::storage::db::backend::port')}"
  # swh-deposit
  - source_db: "%{hiera('swh::deploy::deposit::db::dbname')}"
    host: "%{hiera('swh::deploy::deposit::db::backend::host')}"
    auth_user: "%{hiera('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{hiera('swh::deploy::deposit::db::backend::port')}"
  # swh-scheduler
  - source_db: "%{hiera('swh::deploy::scheduler::db::dbname')}"
    host: "%{hiera('swh::deploy::scheduler::db::backend::host')}"
    auth_user: "%{hiera('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{hiera('swh::deploy::scheduler::db::backend::port')}"
  # swh-vault
  - source_db: "%{hiera('swh::deploy::vault::db::dbname')}"
    host: "%{hiera('swh::deploy::vault::db::backend::host')}"
    auth_user: "%{hiera('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{hiera('swh::deploy::vault::db::backend::port')}"
  # swh-indexer
  - source_db: "%{hiera('swh::deploy::indexer::storage::db::dbname')}"
    host: "%{hiera('swh::deploy::indexer::storage::db::backend::host')}"
    auth_user: "%{hiera('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{hiera('swh::deploy::indexer::storage::db::backend::port')}"
  # swh-web
  - source_db: "%{hiera('swh::deploy::webapp::db::name')}"
    host: "%{hiera('swh::deploy::webapp::db::backend::host')}"
    auth_user: "%{hiera('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{hiera('swh::deploy::webapp::db::backend::port')}"
  # swh-scrubber
  - source_db: "%{hiera('swh::deploy::scrubber::db::dbname')}"
    host: "%{hiera('swh::deploy::scrubber::db::backend::host')}"
    auth_user: "%{hiera('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{hiera('swh::deploy::scrubber::db::backend::port')}"
  # catch-all
  - source_db: "*"
    host: 127.0.0.1
    auth_user: postgres
    port: "%{hiera('swh::deploy::db::secondary::port')}"
