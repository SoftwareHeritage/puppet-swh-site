zfs::common::zpool_configuration:
  disk:
    - wwn-0x614187703860aa001dc215281314283b-part3

mountpoints:
  # local mountpoints (already configured, don't touch it)
  /srv/storage/space:
    ensure: absent
  /tmp:
    # Don't mount /tmp from rocquencourt_sesi.yaml
    ensure: absent
  swap:
    # Don't mount swap from rocquencourt_sesi.yaml
    ensure: absent

rancher::rke2::agent::snapshotter: zfs
