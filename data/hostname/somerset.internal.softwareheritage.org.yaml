backups::exclude:
  - srv/softwareheritage/postgres

# that's a mirror of the load on the host...
icinga2::host::vars:
  load: high

prometheus::sql::config_snippets:
  - swh-indexer

pgbouncer::auth_hba_file: /etc/postgresql/13/replica/pg_hba.conf
pgbouncer::listen_addr: 192.168.100.103
pgbouncer::databases:
  # swh
  - source_db: "%{lookup('swh::deploy::storage::db::dbname')}"
    host: somerset.internal.softwareheritage.org
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::db::main::port')}"
  - source_db: "%{lookup('swh::deploy::indexer::storage::db::dbname')}"
    host: belvedere.internal.softwareheritage.org
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::db::indexer::port')}"

mountpoints:
  /srv/remote-backups:
    ensure: absent
  /tmp:
    ensure: absent
  /srv/storage/space:
    ensure: absent
  swap:
    ensure: absent
