---
networks:
  bond0:
    type: manual
    order: 10
    extras:
      mtu: "9000"
      bond-miimon: 100
      bond-mode: 802.3ad
      bond-xmit_hash_policy: layer3+4
      bond-slaves: eno1 eno2
      bond-lacp-rate: 1
  vlan440:
    type: private
    order: 20
    address: 192.168.100.51
    netmask: 24
    gateway: 192.168.100.1
    mtu: "9000"
    extras:
      vlan-raw-device: bond0

users:
  olasd:
    groups:
      - docker
  seirl:
    groups:
      - sudo
      - docker
  zack:
    groups:
      - docker
  vigna:
    uid: 3000
    full_name: Sebastiano Vigna
    shell: /bin/false
    authorized_keys:
  andreystar:
    uid: 3001
    full_name: Andrey Starodubtsev
    shell: /bin/false
    authorized_keys:
  zom:
    uid: 3002
    full_name: Tommaso Fontana
    shell: /bin/bash
    authorized_keys:
      zom@swh:
        type: ssh-ed25519
        key: AAAAC3NzaC1lZDI1NTE5AAAAIMG/RXBiwyz3mKwsm9cfGLgDwjkWgMHCRsiLlSrMsnku

