swh::apt_config::enable_non_free: true

backups::exclude:
  - srv/softwareheritage

icinga2::host::vars:
  load: high

pgbouncer::auth_hba_file: /etc/postgresql/16/replica/pg_hba.conf
pgbouncer::listen_addr: 192.168.100.211
swh::deploy::db::pgbouncer::user::login: pgbouncer
pgbouncer::databases:
  - source_db: "%{lookup('swh::deploy::storage::db::dbname')}"
    host: "127.0.0.1"
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::db::main::port')}"

pgbouncer::config_params:
  auth_query: 'SELECT username, password from pgbouncer.get_auth($1)'

pgbouncer::userlist:
  - user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    password: "%{lookup('swh::deploy::db::pgbouncer::user::password')}"
    hash_type: plain

mountpoints:
  /srv/remote-backups:
    ensure: absent
  /tmp:
    ensure: absent
  /srv/storage/space:
    ensure: absent
  swap:
    ensure: absent
