# open vault api
swh::deploy::vault::backend::listen::host: 0.0.0.0

# vault's cache backend is an azure objstorage
swh::deploy::vault::config::cache:
  cls: azure
  connection_string: "DefaultEndpointsProtocol=https;AccountName=%{hiera('swh::azure::credentials::vaultstorage::account')};AccountKey=%{hiera('swh::azure::credentials::vaultstorage::key')};EndpointSuffix=core.windows.net"
  container_name: contents-uncompressed
  compression: none

# No workers
swh::deploy::worker::instances: []
