---
backups::exclude:
  - srv/kafka
  - srv/kubernetes/volumes
  - srv/softwareheritage/objects
  - srv/softwareheritage/postgresql

swh::apt_config::enable_non_free: true
packages:
  - intel-microcode
  - vlan
  - ifenslave

swh::apt_config::backported_packages:
  buster:
    - linux-image-amd64
    - linux-headers-amd64
    - libnvpair1linux
    - libuutil1linux
    - libzfs2linux
    - libzpool2linux
    - zfs-dkms
    - zfsutils-linux
    - zfs-zed

rancher::rke2::agent::snapshotter: zfs

# Empty because it got already configured and we want to keep it as-is
zfs::common::zpool_configuration: {}

icinga2::host::vars:
  disks:
    disk /srv/softwareheritage/objects:
      disk_wfree: '9%'
      disk_cfree: '5%'
