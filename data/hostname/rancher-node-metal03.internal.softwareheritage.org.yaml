---
# local cache is not compatible with rancher
dns::local_cache: false
dns::nameservers:
  - 192.168.100.29
  - 192.168.200.22

icinga2::host::vars:
  load: high

# override the default values
mountpoints:
  /srv/storage/space:
    ensure: absent

swh::apt_config::enable_non_free: true

zfs::common::zpool_configuration:
  disk:
    - nvme-eui.000000000000000100a07523415a9753
    - nvme-eui.000000000000000100a07523415a9bd8

zfs::arc::max_size: 34359738368  # 32 GiB
