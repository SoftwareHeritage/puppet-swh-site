---
# local cache is not compatible with rancher
dns::local_cache: false
dns::nameservers:
  - 192.168.100.29
  - 192.168.200.22

icinga2::host::vars:
  load: high

# override the default values
mountpoints:
  /srv/storage/space:
    ensure: absent
  swap:
    ensure: absent

swh::apt_config::enable_non_free: true

zfs::common::zpool_configuration:
  mirror:
    - /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFC6C /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFC75
    - /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFC7A /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFC82
    - /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFC8C /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFC96
    - /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFCB0 /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFCD8
    - /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFCDB /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFD23
    - /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFD26 /dev/disk/by-id/nvme-MO006400KXPAB_240747ABFD3C

zfs::arc::max_size: 34359738368  # 32 GiB

rancher::rke2::agent::snapshotter: zfs
tmpfs::size: 512g
