---
mountpoints:
  /tmp:
    ensure: absent
  swap:
    ensure: absent


icinga2::host::vars:
  load: sql

backups::exclude:
  - srv/kubernetes/volumes
  - srv/softwareheritage/objects
  - srv/softwareheritage/postgresql

swh::postgresql::max_connections: 400

swh::apt_config::enable_non_free: true
packages:
  - intel-microcode
  - vlan
  - ifenslave

swh::apt_config::backported_packages:
  buster:
    - linux-image-amd64
    - linux-headers-amd64
    - libnvpair1linux
    - libuutil1linux
    - libzfs2linux
    - libzpool2linux
    - zfs-dkms
    - zfsutils-linux
    - zfs-zed

prometheus::sql::config_snippets:
  - swh-scheduler
  - swh-storage
  - swh-scrubber

rancher::rke2::agent::snapshotter: zfs

# Empty because already configured and we want to keep it as-is
zfs::common::zpool_configuration: {}
