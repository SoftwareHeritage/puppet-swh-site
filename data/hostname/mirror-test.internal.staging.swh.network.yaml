swh::postgres::service::users:
  - root
  - zack
  - ardumont
  - ddouard
  - vsellier


swh::postgres::service::dbs:
  - alias: swh-mirror
    name: swh-mirror
    host: "%{alias('swh::deploy::storage::db::host')}"
    port: "%{alias('swh::deploy::db::pgbouncer::port')}"
    user: guest
    password: guest
  - alias: admin-swh-mirror
    name: swh-mirror
    host: "%{alias('swh::deploy::storage::db::host')}"
    port: "%{alias('swh::deploy::db::pgbouncer::port')}"
    user: swh-mirror
    password: "%{lookup('swh::deploy::mirror::db::password')}"
  - alias: swh
    name: "%{lookup('swh::deploy::storage::db::dbname')}"
    host: "%{lookup('swh::deploy::storage::db::host')}"
    port: "%{lookup('swh::deploy::db::pgbouncer::port')}"
    user: guest
