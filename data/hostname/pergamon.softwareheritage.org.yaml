dns::local_cache: false

# Overrides for primary bind server
bind::zones::type: master
dns::forwarders: []

smtp::relay_destinations:
  - destination: "%{lookup('phabricator::vhost::name')}"
    route: smtp:[tate.internal.softwareheritage.org]

smtp::extra_aliases_files:
  - base_directory: /etc/postfix/swh-web-inbound-email
    owner: swhwebapp
    group: swhwebapp
    contents: {}

smtp::mynetworks:
  - 127.0.0.0/8
  - "[::ffff:127.0.0.0]/104"
  - "[::1]/128"
  - 192.168.100.0/23
  - 192.168.200.0/21
  - 192.168.50.0/24

# Set apache MPM to prefork
apache::mpm_module: prefork

backups::exclude:
  - srv/softwareheritage/annex/annexroot
  - srv/softwareheritage/bitbucket-archive
  - srv/softwareheritage/www-wordpress-static-backup
  - var/lib/prometheus

icinga2::role: master

icinga2::features:
  - checker
  - mainlog
  - notification
  - compatlog
  - command

systemd_journal::role: collector

users:
  jenkins-push-docs:
    uid: 3000
    full_name: Jenkins Documentation Push user
    shell: /bin/false
    authorized_keys:
      jenkins-push-docs@thyssen:
        type: ssh-rsa
        key: disabled

  boatbucket:
    uid: 1002
    full_name: Bitbucket Life Raft
    shell: /bin/bash

groups:
  jenkins-push-docs:
    gid: 3000
  boatbucket:
    gid: 1024

thanos::tenant: historical-data

swh::postgresql::version: "15"
swh::postgresql::max_connections: 200
