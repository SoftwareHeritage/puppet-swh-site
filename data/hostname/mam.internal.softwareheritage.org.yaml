---
icinga2::host::vars:
  load: high

nginx::simple_vhosts:
  provenance:
    server_names:
      - mam.internal.softwareheritage.org
      - "%{lookup('swh::deploy::provenance_export::base_url')}"
    www_root: /data/ddouard/upload/provenance-heads
    http_check_string: 'Index of /'
    nginx_params:
      autoindex: 'on'
      location_custom_cfg:
        sendfile: 'on'
        sendfile_max_chunk: '16M'

users:
  adesmaz:
    uid: 1036
    full_name: Adèle Desmazières
    shell: /bin/bash
    groups:
      - swhdev
    authorized_keys:
      adesmaz:
        type: ssh-rsa
        key: 

swh::apt_config::enable_non_free: true

