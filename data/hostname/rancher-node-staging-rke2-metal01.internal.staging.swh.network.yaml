---
# local cache is not compatible with rancher
dns::local_cache: false
dns::nameservers:
  - 192.168.100.29
  - 192.168.200.22

icinga2::host::vars:
  load: high

# override the default values
mountpoints:
  /srv/storage/space:
    ensure: absent

swh::apt_config::enable_non_free: true

zfs::common::zpool_configuration:
  mirror:
    - wwn-0x50000396ec892211 wwn-0x50000396ec89220d
    - wwn-0x50000396ec892205 wwn-0x50000396ec894e39
    - wwn-0x50000397bc8969ad wwn-0x50000397bc8969b5
  spare:
    # Those can't be used as mirror since they don't have the same size. zpool
    # complains with 'mirror contains devices of different sizes' otherwise
    - wwn-0x50000396ec892251
    - wwn-0x500003976c880145

zfs::arc::max_size: 34359738368  # 32 GiB

rancher::rke2::agent::snapshotter: zfs
