prometheus::sql::config_snippets:
  - swh-scheduler
  - swh-storage
  - swh-scrubber

pgbouncer::auth_hba_file: /etc/postgresql/11/secondary/pg_hba.conf
pgbouncer::listen_addr: 192.168.100.210
pgbouncer::databases:
  # swh
  - source_db: "%{lookup('swh::deploy::storage::db::dbname')}"
    host: "%{lookup('swh::deploy::storage::db::backend::host')}"
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::storage::db::backend::port')}"
  # swh-deposit
  - source_db: "%{lookup('swh::deploy::deposit::db::dbname')}"
    host: "%{lookup('swh::deploy::deposit::db::backend::host')}"
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::deposit::db::backend::port')}"
  # swh-scheduler
  - source_db: "%{lookup('swh::deploy::scheduler::db::dbname')}"
    host: "%{lookup('swh::deploy::scheduler::db::backend::host')}"
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::scheduler::db::backend::port')}"
  # swh-vault
  - source_db: "%{lookup('swh::deploy::vault::db::dbname')}"
    host: "%{lookup('swh::deploy::vault::db::backend::host')}"
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::vault::db::backend::port')}"
  # swh-indexer
  - source_db: "%{lookup('swh::deploy::indexer::storage::db::dbname')}"
    host: "%{lookup('swh::deploy::indexer::storage::db::backend::host')}"
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::indexer::storage::db::backend::port')}"
  # swh-web
  - source_db: "%{lookup('swh::deploy::webapp::db::name')}"
    host: "%{lookup('swh::deploy::webapp::db::backend::host')}"
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::webapp::db::backend::port')}"
  # swh-scrubber
  - source_db: "%{lookup('swh::deploy::scrubber::db::dbname')}"
    host: "%{lookup('swh::deploy::scrubber::db::backend::host')}"
    auth_user: "%{lookup('swh::deploy::db::pgbouncer::user::login')}"
    port: "%{lookup('swh::deploy::scrubber::db::backend::port')}"
  # catch-all
  - source_db: "*"
    host: 127.0.0.1
    auth_user: postgres
    port: "%{lookup('swh::deploy::db::secondary::port')}"

swh::apt_config::enable_non_free: true
packages:
  - intel-microcode

backups::exclude:
  - data

icinga2::host::vars:
  load: high


mountpoints:
  /srv/remote-backups:
    device: saam:/srv/storage/space/postgres-backups/prado
    fstype: nfs
    options:
      - rw
      - soft
      - intr
      - rsize=8192
      - wsize=8192
      - x-systemd.automount
      - x-systemd.device-timeout=10
  /tmp:
    ensure: absent
  /srv/storage/space:
    ensure: absent
  swap:
    ensure: absent
