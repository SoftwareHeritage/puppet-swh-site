---
# local cache is not compatible with rancher
dns::local_cache: false
dns::nameservers:
  - 192.168.100.29
  - 192.168.200.22

icinga2::host::vars:
  load: high

# override the default values
mountpoints:
  /srv/storage/space:
    ensure: absent

swh::apt_config::enable_non_free: true

zfs::common::zpool_configuration:
  mirror:
    - wwn-0x5002538c409a8258 wwn-0x5002538c409a825a
    - wwn-0x5002538c409a8252 wwn-0x5002538b00657d80
    - wwn-0x5002538c40ba6716 wwn-0x5002538c409a8253
    - wwn-0x5002538c40ba6713 wwn-0x5002538c40ba66ab
  spare:
    - wwn-0x5002538c409a8256

zfs::arc::max_size: 34359738368  # 32 GiB
