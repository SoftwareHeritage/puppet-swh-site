---
# File managed by puppet. Changes will be lost.
#
# Common Anubis rules for Software Heritage

- name: allow-cors
  action: ALLOW
  expression: 'method == "OPTIONS"'

- name: local-monitoring
  action: ALLOW
  user_agent_regex: "(check_http|Blackbox Exporter)"
  remote_addresses:
    - 128.93.166.14/32
    - 192.168.50.0/24

- name: badges
  action: ALLOW
  expression:
    all:
      - 'path.startsWith("/badge/")'
      - '"Sec-Fetch-Mode" in headers'
      - "userAgent.contains('Mozilla')"

- name: updateSWH
  action: ALLOW
  expression:
    all:
      - 'path.startsWith("/api/1/origin/")'
      - '"Sec-Fetch-Mode" in headers'
      - "userAgent.contains('Mozilla')"

- name: APIs
  action: ALLOW
  expression:
    all:
      - 'path.startsWith("/api/") || path.startsWith("/graphql/")'
      - '"Accept" in headers'
      - 'headers["Accept"] == "application/json" || headers["Accept"] == "application/yaml"'

- name: API documentations
  action: ALLOW
  path_regex: ^/api/(1/|.*/doc/)?$

- name: swh-web static resources
  action: ALLOW
  path_regex: ^/(static|jsreverse)/
